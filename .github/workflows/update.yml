name: Update hockey data

on:
  schedule:
    - cron: '11 */2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Ignore the "not due yet" shortcuts and refresh everything'
        type: boolean
        default: false

concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh data.json
        id: update
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node updater/update.mjs ${{ inputs.force && '--force' || '' }}

      - name: Commit changes
        run: |
          git config user.name  "all-hockey-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json updater/state.json
          if git diff --cached --quiet; then echo "Nothing to commit"; else
            git commit -m "Update data $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi

      - name: Fail loudly if something has been broken for a while
        if: steps.update.outcome == 'failure'
        run: |
          echo "A source has failed several runs in a row. See the 'Refresh data.json' step above."
          exit 1
